<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaintProfit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0a;
      --bg-card: rgba(255,255,255,0.03);
      --bg-card-hover: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --accent-1: #ff6b35;
      --accent-2: #ff8c42;
      --accent-3: #00d4aa;
      --text-primary: #f0f0f0;
      --text-secondary: #999;
      --text-muted: #666;
      --profit-green: #00d4aa;
      --glow-orange: rgba(255,107,53,0.3);
      --glow-aqua: rgba(0,212,170,0.3);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --radius: 12px;
      --radius-sm: 8px;
    }

    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');

    body {
      width: 280px;
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      padding: 16px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '✦';
      position: absolute;
      top: -10px;
      right: -5px;
      font-size: 3rem;
      opacity: 0.08;
      color: #fff;
    }

    .header h1 {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header-lettering-small {
      height: 22px;
      width: auto;
      display: block;
    }

    .popup-logo {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      vertical-align: middle;
    }

    .popup-footer-logo {
      width: 12px;
      height: 12px;
      vertical-align: middle;
      margin-right: 3px;
      border-radius: 3px;
    }

    .header .ver {
      font-size: 0.55rem;
      opacity: 0.7;
      font-weight: 500;
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 1px;
    }

    /* ===== CONTENT ===== */
    .content { padding: 14px; }

    .section-label {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
    }

    .mode-btn {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      margin-bottom: 8px;
    }

    .mode-btn:last-child { margin-bottom: 0; }

    .mode-btn:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      transform: translateY(-1px);
    }

    .mode-btn .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .mode-btn .icon.profit {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    }

    .mode-btn .icon.invest {
      background: linear-gradient(135deg, #a855f7, #6366f1);
    }

    .mode-btn .info {
      flex: 1;
      min-width: 0;
    }

    .mode-btn .info .title {
      font-size: 0.85rem;
      font-weight: 700;
      display: block;
    }

    .mode-btn .info .desc {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .mode-btn .arrow {
      font-size: 1rem;
      color: var(--text-muted);
      transition: transform var(--transition);
    }

    .mode-btn:hover .arrow {
      transform: translateX(3px);
      color: var(--accent-1);
    }

    /* ===== FOOTER ===== */
    .footer {
      padding: 10px 14px;
      text-align: center;
      font-size: 0.55rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      letter-spacing: 0.3px;
    }

    .footer .sp-highlight {
      color: var(--accent-3);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><img src="icons/icon16.png" class="popup-logo" alt=""> <img src="icons/lettering-small.png" class="header-lettering-small" alt="SaintProfit"></h1>
    <span class="ver" id="versionTag">v2.0.0</span>
  </div>

  <div class="content">
    <div class="section-label">Elegí un modo</div>

    <button class="mode-btn" id="btnProfit">
      <span class="icon profit">💵</span>
      <span class="info">
        <span class="title">SteamFarm</span>
        <span class="desc">Maximizá ganancias CSFloat → Steam</span>
      </span>
      <span class="arrow">→</span>
    </button>

    <button class="mode-btn" id="btnInvest">
      <span class="icon" style="background:linear-gradient(135deg,#a855f7,#6366f1);">🧠</span>
      <span class="info">
        <span class="title">Smart Invest</span>
        <span class="desc">Optimizá tu saldo con Knapsack Inteligente</span>
      </span>
      <span class="arrow">→</span>
    </button>

    <button class="mode-btn" id="btnSniper">
      <span class="icon" style="background:linear-gradient(135deg,#ff3366,#ff6b35);">🎯</span>
      <span class="info">
        <span class="title">Market Sniper</span>
        <span class="desc">Detectá publicaciones mal valoradas</span>
      </span>
      <span class="arrow">→</span>
    </button>
  </div>

  <div class="footer"><img src="icons/icon16.png" class="popup-footer-logo" alt=""> <span class="sp-highlight">SaintProfit</span> · CS2 Skin Arbitrage Tool</div>

  <script src="js/popup.js"></script>
</body>
</html>
